---
name: Run Tests and Generate Reports

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      - name: Build services
        run: |
          docker-compose -f docker-compose.ci.yml build backend tests

      - name: Start services with simple waiting
        run: |
          docker-compose -f docker-compose.ci.yml up -d
          echo "Waiting for services to start..."
          sleep 30
          echo "Checking services status..."
          docker-compose -f docker-compose.ci.yml ps
          echo "Backend logs:"
          docker-compose -f docker-compose.ci.yml logs backend --tail=20

      - name: Check backend availability
        run: |
          for i in {1..10}; do
            if curl -s http://localhost:8000/health > /dev/null; then
              echo "Backend is responding!"
              break
            fi
            echo "Waiting for backend... ($i/10)"
            sleep 5
          done

      - name: Initialize database
        run: |
          docker-compose -f docker-compose.ci.yml exec backend python -c "
          try:
              from database.database import engine
              from models.user import Base
              Base.metadata.create_all(bind=engine)
              print('Database tables created')
          except Exception as e:
              print(f'Database warning: {e}')
          " || echo "Database initialization completed"

      - name: Run API tests with Allure
        run: |
          docker-compose -f docker-compose.ci.yml run --rm tests \
            python -m pytest api/ -v --alluredir=/tmp/allure-results

      - name: Generate Allure report
        run: |
          mkdir -p allure-report
          docker-compose -f docker-compose.ci.yml run --rm tests \
            allure generate /tmp/allure-results -o /tmp/allure-report --clean
          
          # Копируем отчет из контейнера
          docker cp $(docker-compose -f docker-compose.ci.yml ps -q tests):/tmp/allure-report/. allure-report/
          echo "Allure report generated with charts and graphs"

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      - name: Save and upload service logs
        if: always()
        run: |
          docker-compose -f docker-compose.ci.yml logs > docker-compose-logs.txt
          echo "Backend Logs" > detailed-logs.txt
          docker-compose -f docker-compose.ci.yml logs backend >> detailed-logs.txt

      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: |
            docker-compose-logs.txt
            detailed-logs.txt
          retention-days: 30

  performance:
    runs-on: ubuntu-latest
    needs: api
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

      - name: Start services for performance tests
        run: |
          docker-compose -f docker-compose.ci.yml up -d
          sleep 30
          docker-compose -f docker-compose.ci.yml ps

      - name: Run simple performance test
        run: |
          docker-compose -f docker-compose.ci.yml run --rm tests python -c "import requests; import time; successes = 0; start_time = time.time(); print('Testing backend availability...'); [exec('try: response = requests.get(\\\"http://backend:8000/health\\\", timeout=5); print(\\\"Request {}: SUCCESS\\\".format(i+1) if response.status_code == 200 else \\\"Request {}: FAILED (Status: {})\\\".format(i+1, response.status_code)); successes += 1 if response.status_code == 200 else 0; except: print(\\\"Request {}: FAILED (Connection error)\\\".format(i+1)); time.sleep(1)') for i in range(5)]; duration = time.time() - start_time; print('Results: {}/5 successful'.format(successes)); print('Performance test PASSED' if successes >= 3 else 'Performance test FAILED'); exit(0 if successes >= 3 else 1)"

  report:
    runs-on: ubuntu-latest
    needs: [api, performance]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Allure report artifact
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Verify and prepare Allure report
        run: |
          echo "Checking Allure report..."
          if [ -d "allure-report" ] && [ -f "allure-report/index.html" ]; then
            echo "✓ Full Allure report with charts is ready"
            echo "Report includes:"
            find allure-report -name "*.html" -o -name "*.json" | head -10
          else
            echo "Creating basic Allure report structure..."
            mkdir -p allure-report/data
            echo '<!DOCTYPE html><html><head><title>Allure Report</title><style>body{font-family:Arial,sans-serif;margin:40px}.container{max-width:800px;margin:0 auto}.warning{background:#fff3cd;border:1px solid #ffeaa7;padding:20px;border-radius:5px}</style></head><body><div class="container"><h1>Allure Test Report</h1><div class="warning"><h2>Report Not Fully Generated</h2><p>Full Allure report with charts and graphs is only available when tests generate proper Allure results.</p><p>To get full report, ensure tests are run with <code>--alluredir</code> parameter.</p></div></div></body></html>' > allure-report/index.html
            echo "Placeholder report created"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4
        if: github.ref == 'refs/heads/main'

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        if: github.ref == 'refs/heads/main'