---
name: Run Tests and Generate Reports

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      - name: Build services
        run: |
          docker-compose -f docker-compose.ci.yml build backend tests

      - name: Start services with simple waiting
        run: |
          docker-compose -f docker-compose.ci.yml up -d
          echo "Waiting for services to start..."
          sleep 30
          echo "Checking services status..."
          docker-compose -f docker-compose.ci.yml ps
          echo "Backend logs:"
          docker-compose -f docker-compose.ci.yml logs backend --tail=20

      - name: Check backend availability
        run: |
          for i in {1..10}; do
            if curl -s http://localhost:8000/health > /dev/null; then
              echo "Backend is responding!"
              break
            fi
            echo "Waiting for backend... ($i/10)"
            sleep 5
          done

      - name: Initialize database
        run: |
          docker-compose -f docker-compose.ci.yml exec backend python -c "
          try:
              from database.database import engine
              from models.user import Base
              Base.metadata.create_all(bind=engine)
              print('Database tables created')
          except Exception as e:
              print(f'Database warning: {e}')
          " || echo "Database initialization completed"

      - name: Run API tests and generate Allure report
        run: |
          # Запускаем тесты и генерируем отчет в одном контейнере
          mkdir -p allure-report
          docker-compose -f docker-compose.ci.yml run --rm -v $(pwd)/allure-report:/host-report tests bash -c "
            echo 'Running API tests with Allure...'
            python -m pytest api/ -v --alluredir=/tmp/allure-results
            
            echo 'Checking if Allure results were created...'
            if [ -d '/tmp/allure-results' ] && [ \"\$(ls -A /tmp/allure-results)\" ]; then
              echo 'Generating Allure report...'
              allure generate /tmp/allure-results -o /tmp/allure-report --clean
              echo 'Copying Allure report to host...'
              cp -r /tmp/allure-report/* /host-report/
              echo 'Allure report generated and copied successfully'
            else
              echo 'No Allure results found, creating basic report...'
              echo '<html><body><h1>Test Report</h1><p>No test results available</p></body></html>' > /host-report/index.html
            fi
          "
          
          echo "Allure report contents on host:"
          ls -la allure-report/

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      - name: Save and upload service logs
        if: always()
        run: |
          docker-compose -f docker-compose.ci.yml logs > docker-compose-logs.txt
          echo "Backend Logs" > detailed-logs.txt
          docker-compose -f docker-compose.ci.yml logs backend >> detailed-logs.txt

      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: |
            docker-compose-logs.txt
            detailed-logs.txt
          retention-days: 30

  performance:
    runs-on: ubuntu-latest
    needs: api
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

      - name: Start services for performance tests
        run: |
          docker-compose -f docker-compose.ci.yml up -d
          sleep 30
          docker-compose -f docker-compose.ci.yml ps

      - name: Run simple performance test
        run: |
          docker-compose -f docker-compose.ci.yml run --rm tests python -c "import requests; successes = 0; print('Testing backend...'); [exec('try: r = requests.get(\"http://backend:8000/health\", timeout=3); successes += 1 if r.status_code == 200 else 0; print(f\"Request {i+1}: {\"SUCCESS\" if r.status_code == 200 else \"FAILED\"}\") except: print(f\"Request {i+1}: ERROR\"); __import__(\"time\").sleep(1)' for i in range(3)]; print(f'Results: {successes}/3'); exit(0 if successes >= 2 else 1)"

  report:
    runs-on: ubuntu-latest
    needs: [api, performance]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Allure report artifact
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Verify and prepare Allure report
        run: |
          echo "Checking Allure report..."
          if [ -d "allure-report" ] && [ -f "allure-report/index.html" ]; then
            echo "✓ Full Allure report with charts is ready"
            echo "Report contents:"
            find allure-report -type f | head -10
          else
            echo "Allure report not found, creating basic report..."
            mkdir -p allure-report
            echo '<!DOCTYPE html><html><head><title>Allure Report</title><style>body{font-family:Arial,sans-serif;margin:40px}.container{max-width:800px;margin:0 auto}.warning{background:#fff3cd;border:1px solid #ffeaa7;padding:20px;border-radius:5px}</style></head><body><div class="container"><h1>Allure Test Report</h1><div class="warning"><h2>Report Not Available</h2><p>Full Allure report could not be generated in this run.</p><p>Check workflow logs for test results.</p></div></div></body></html>' > allure-report/index.html
            echo "Basic report created"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4
        if: github.ref == 'refs/heads/main'

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        if: github.ref == 'refs/heads/main'