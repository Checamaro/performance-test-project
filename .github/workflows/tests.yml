name: Run Tests and Generate Reports

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_COMPOSE_VERSION: v2.24.5

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Compose
      run: |
        sudo curl -L "https://github.com/docker/compose/releases/download/${{ env.DOCKER_COMPOSE_VERSION }}/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
        sudo chmod +x /usr/local/bin/docker-compose
        docker-compose --version

    - name: Build services
      run: |
        docker-compose -f docker-compose.ci.yml build backend tests

    - name: Start services with proper waiting
      run: |
        docker-compose -f docker-compose.ci.yml up -d
        
        echo "Waiting for services to be ready..."
        # Ждем PostgreSQL
        timeout 60 bash -c 'until docker-compose -f docker-compose.ci.yml exec -T postgres pg_isready -U user -d auth_db; do sleep 2; done'
        echo "PostgreSQL is ready"
        
        # Ждем Kafka
        timeout 60 bash -c 'until docker-compose -f docker-compose.ci.yml exec -T kafka kafka-topics --bootstrap-server kafka:9092 --list; do sleep 5; done'
        echo "Kafka is ready"
        
        # Ждем бэкенд с проверкой health
        timeout 120 bash -c 'while ! curl -s http://localhost:8000/health > /dev/null; do sleep 5; done'
        echo "Backend is ready"

    - name: Initialize database
      run: |
        # Принудительно создаем таблицы
        docker-compose -f docker-compose.ci.yml exec -T backend python -c "
        from database.database import engine
        from models.user import Base
        try:
            Base.metadata.drop_all(bind=engine)
            Base.metadata.create_all(bind=engine)
            print('Database tables recreated successfully')
        except Exception as e:
            print(f'Database initialization warning: {e}')
        "

    - name: Check services status
      run: |
        docker-compose -f docker-compose.ci.yml ps
        echo "=== Backend health check ==="
        curl -f http://localhost:8000/health

    - name: Run API tests
      run: |
        docker-compose -f docker-compose.ci.yml run --rm tests python -m pytest api/ -v --alluredir=/tmp/allure-results

    - name: Generate Allure report
      run: |
        mkdir -p allure-report
        docker-compose -f docker-compose.ci.yml run --rm tests allure generate /tmp/allure-results -o /tmp/allure-report --clean
        # Копируем отчет из контейнера
        docker cp $(docker-compose -f docker-compose.ci.yml ps -q tests):/tmp/allure-report/. allure-report/

    - name: Upload Allure report
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30

    - name: Save and upload service logs
      if: always()
      run: |
        docker-compose -f docker-compose.ci.yml logs > docker-compose-logs.txt
      env:
        DOCKER_COMPOSE_FILE: docker-compose.ci.yml

    - name: Upload service logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: service-logs
        path: docker-compose-logs.txt
        retention-days: 30

  performance:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Compose
      run: |
        sudo curl -L "https://github.com/docker/compose/releases/download/${{ env.DOCKER_COMPOSE_VERSION }}/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
        sudo chmod +x /usr/local/bin/docker-compose

    - name: Build and start services
      run: |
        docker-compose -f docker-compose.ci.yml up -d --build
        
        echo "Waiting for services to be ready..."
        # Ждем PostgreSQL
        timeout 60 bash -c 'until docker-compose -f docker-compose.ci.yml exec -T postgres pg_isready -U user -d auth_db; do sleep 2; done'
        
        # Ждем бэкенд
        timeout 120 bash -c 'while ! curl -s http://localhost:8000/health > /dev/null; do sleep 5; done'
        echo "All services are ready"

    - name: Initialize database for performance tests
      run: |
        docker-compose -f docker-compose.ci.yml exec -T backend python -c "
        from database.database import engine
        from models.user import Base
        Base.metadata.create_all(bind=engine)
        print('Database ready for performance tests')
        "

    - name: Run improved load test
      run: |
        docker-compose -f docker-compose.ci.yml run --rm tests python -c "
        import requests
        import time
        import random
        
        def test_single_registration():
            '''Test single registration with detailed logging'''
            try:
                email = f'test_{random.randint(1000,9999)}_{int(time.time())}@example.com'
                response = requests.post(
                    'http://backend:8000/register',
                    json={'email': email, 'password': 'testpassword123'},
                    timeout=10
                )
                print(f'Registration {email}: Status {response.status_code}')
                if response.status_code != 200:
                    print(f'  Response: {response.text[:100]}')
                return response.status_code
            except Exception as e:
                print(f'Registration error: {e}')
                return 'Error'
        
        print('=== Starting load test ===')
        
        # Сначала тестируем одиночный запрос
        print('1. Testing single request...')
        single_result = test_single_registration()
        
        if single_result == 200:
            print('✓ Single request test PASSED')
            
            # Запускаем нагрузочный тест с паузами
            print('2. Starting sequential load test (10 requests with 0.5s delay)...')
            successes = 0
            errors = 0
            start_time = time.time()
            
            for i in range(10):
                result = test_single_registration()
                if result == 200:
                    successes += 1
                else:
                    errors += 1
                time.sleep(0.5)  # Пауза между запросами
            
            duration = time.time() - start_time
            print(f'=== Load Test Results ===')
            print(f'Successful: {successes}/10')
            print(f'Errors: {errors}/10') 
            print(f'Duration: {duration:.2f}s')
            print(f'RPS: {10/duration:.2f}')
            
            # Более мягкие критерии для CI
            if successes >= 6:  # 60% успешных
                print('✓ Load test PASSED')
                exit(0)
            else:
                print('✗ Load test FAILED - not enough successful requests')
                exit(1)
        else:
            print(f'✗ Single request test FAILED: {single_result}')
            print('Skipping load test due to single request failure')
            exit(1)
        "

  report:
    runs-on: ubuntu-latest
    needs: [test, performance]
    if: always()

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Allure report
      uses: actions/download-artifact@v4
      with:
        name: allure-report
        path: ./downloaded-allure-report

    - name: Prepare and deploy report
      run: |
        # Если отчет скачался, используем его
        if [ -d "./downloaded-allure-report" ]; then
          echo "Using downloaded Allure report"
          mkdir -p allure-report
          cp -r ./downloaded-allure-report/* allure-report/
        else
          echo "No Allure report found, creating placeholder"
          mkdir -p allure-report
          cat > allure-report/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <title>Test Report</title>
              <style>body { font-family: Arial; margin: 40px; }</style>
          </head>
          <body>
              <h1>Test Execution Report</h1>
              <p>No test results available. Check workflow logs for details.</p>
          </body>
          </html>
          EOF
        fi
        
        echo "Report contents:"
        ls -la allure-report/

    - name: Setup Pages
      uses: actions/configure-pages@v4
      if: github.ref == 'refs/heads/main'

    - name: Upload to GitHub Pages
      uses: actions/upload-pages-artifact@v3
      if: github.ref == 'refs/heads/main'
      with:
        path: allure-report

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
      if: github.ref == 'refs/heads/main'