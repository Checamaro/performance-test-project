name: Run Tests and Generate Reports

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_COMPOSE_VERSION: v2.24.5

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Compose
      run: |
        sudo curl -L "https://github.com/docker/compose/releases/download/${{ env.DOCKER_COMPOSE_VERSION }}/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
        sudo chmod +x /usr/local/bin/docker-compose
        docker-compose --version

    - name: Build services
      run: |
        docker-compose -f docker-compose.ci.yml build backend tests

    - name: Start services with proper waiting
      run: |
        docker-compose -f docker-compose.ci.yml up -d
        
        # Ждем готовности PostgreSQL
        echo "Waiting for PostgreSQL..."
        timeout 60s bash -c 'until docker-compose -f docker-compose.ci.yml exec postgres pg_isready -U user -d auth_db; do sleep 2; done'
        
        # Ждем готовности бэкенда
        echo "Waiting for backend..."
        timeout 120s bash -c 'while ! curl -s http://localhost:8000/health > /dev/null; do sleep 5; done'
        
        echo "All services are ready!"

    - name: Initialize database
      run: |
        # Принудительно создаем таблицы
        docker-compose -f docker-compose.ci.yml exec backend python -c "
        from database.database import engine
        from models.user import Base
        Base.metadata.create_all(bind=engine)
        print('Database tables created successfully')
        "

    - name: Check services status
      run: |
        docker-compose -f docker-compose.ci.yml ps
        echo "Backend health:"
        curl -f http://localhost:8000/health

    - name: Run API tests
      run: |
        docker-compose -f docker-compose.ci.yml run --rm tests python -m pytest api/ -v --alluredir=/tmp/allure-results

    - name: Generate Allure report
      run: |
        mkdir -p allure-report
        docker-compose -f docker-compose.ci.yml run --rm tests allure generate /tmp/allure-results -o /tmp/allure-report --clean
        
        # Копируем отчет из контейнера
        docker cp $(docker-compose -f docker-compose.ci.yml ps -q tests):/tmp/allure-report ./allure-report/

    - name: Upload Allure report
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30

    - name: Save logs
      if: always()
      run: |
        docker-compose -f docker-compose.ci.yml logs > docker-compose-logs.txt

    - name: Upload service logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: service-logs
        path: docker-compose-logs.txt
        retention-days: 30

  performance:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Compose
      run: |
        sudo curl -L "https://github.com/docker/compose/releases/download/${{ env.DOCKER_COMPOSE_VERSION }}/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
        sudo chmod +x /usr/local/bin/docker-compose

    - name: Build and start services
      run: |
        docker-compose -f docker-compose.ci.yml up -d
        
        # Ждем готовности сервисов
        echo "Waiting for services..."
        timeout 60s bash -c 'until docker-compose -f docker-compose.ci.yml exec postgres pg_isready -U user -d auth_db; do sleep 2; done'
        timeout 120s bash -c 'while ! curl -s http://localhost:8000/health > /dev/null; do sleep 5; done'

    - name: Initialize database for performance tests
      run: |
        docker-compose -f docker-compose.ci.yml exec backend python -c "
        from database.database import engine
        from models.user import Base
        Base.metadata.create_all(bind=engine)
        print('Database ready for performance tests')
        "

    - name: Run improved load test
      run: |
        docker-compose -f docker-compose.ci.yml run --rm tests python -c "
        import requests
        import time
        import random
        
        def test_registration(user_id):
            try:
                email = f'loadtest_{user_id}_{random.randint(1000,9999)}@example.com'
                response = requests.post(
                    'http://backend:8000/register',
                    json={'email': email, 'password': 'testpassword123'},
                    timeout=10
                )
                return response.status_code
            except Exception as e:
                return f'Error: {e}'
        
        print('Starting improved load test with 10 virtual users...')
        
        # Тестируем сначала один запрос
        print('Testing single request...')
        single_result = test_registration(0)
        print(f'Single request result: {single_result}')
        
        if single_result != 200:
            print('Single request failed, skipping load test')
            exit(1)
        
        # Запускаем нагрузку с задержками между запросами
        results = []
        start_time = time.time()
        
        for i in range(10):  # Уменьшаем до 10 пользователей
            result = test_registration(i)
            results.append(result)
            print(f'Request {i+1}/10: {result}')
            time.sleep(0.5)  # Задержка между запросами
        
        end_time = time.time()
        duration = end_time - start_time
        
        success_count = sum(1 for r in results if r == 200)
        error_count = sum(1 for r in results if isinstance(r, str) or r >= 400)
        
        print(f'Load test completed in {duration:.2f} seconds')
        print(f'Successful: {success_count}/10')
        print(f'Errors: {error_count}/10')
        print(f'RPS: {10/duration:.2f}')
        
        # Показываем ошибки
        for i, result in enumerate(results):
            if result != 200:
                print(f'Error in request {i+1}: {result}')
        
        if success_count >= 8:  # 80% успешных
            print('Load test PASSED')
        else:
            print('Load test FAILED')
            exit(1)
        "

  report:
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Allure report
      uses: actions/download-artifact@v4
      with:
        name: allure-report
        path: allure-report

    - name: Verify and prepare report
      run: |
        # Проверяем что отчет скачался
        if [ -d "allure-report" ]; then
          echo "Allure report downloaded successfully"
          ls -la allure-report/
        else
          echo "No Allure report found, creating placeholder"
          mkdir -p allure-report
          cat > allure-report/index.html << 'EOF'
          <html>
          <body>
            <h1>Allure Report Not Available</h1>
            <p>Test report was not generated. Check test logs for details.</p>
          </body>
          </html>
          EOF
        fi

    - name: Setup Pages
      uses: actions/configure-pages@v4
      if: github.ref == 'refs/heads/main'

    - name: Upload to GitHub Pages
      uses: actions/upload-pages-artifact@v3
      if: github.ref == 'refs/heads/main'
      with:
        path: allure-report

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
      if: github.ref == 'refs/heads/main'