name: Run Tests and Generate Reports

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: auth_db
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      zookeeper:
        image: confluentinc/cp-zookeeper:7.0.0
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
        ports:
          - 2181:2181

      kafka:
        image: confluentinc/cp-kafka:7.0.0
        env:
          KAFKA_ZOOKEEPER_CONNECT: localhost:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        ports:
          - 9092:9092

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and start services
      run: |
        docker-compose up -d backend
        sleep 30

    - name: Check backend health
      run: |
        curl -f http://localhost:8000/health || exit 1

    - name: Run API tests
      run: |
        docker-compose run --rm tests python -m pytest api/ -v --alluredir=/tmp/allure-results

    - name: Generate Allure report
      run: |
        docker-compose run --rm tests allure generate /tmp/allure-results -o allure-report --clean

    - name: Upload Allure report
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30

    - name: Run performance tests
      run: |
        docker-compose up -d locust
        sleep 10
        # Basic smoke test - check if locust starts
        curl -f http://localhost:8089 || echo "Locust health check failed but continuing..."

  performance:
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: auth_db
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      zookeeper:
        image: confluentinc/cp-zookeeper:7.0.0
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
        ports:
          - 2181:2181

      kafka:
        image: confluentinc/cp-kafka:7.0.0
        env:
          KAFKA_ZOOKEEPER_CONNECT: localhost:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        ports:
          - 9092:9092

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build services
      run: |
        docker-compose up -d backend locust
        sleep 30

    - name: Run basic load test
      run: |
        # Run a quick 30-second load test with 2 users
        docker-compose run --rm tests python -c "
        import requests
        import time
        from concurrent.futures import ThreadPoolExecutor
        
        def register_user(user_id):
            try:
                response = requests.post(
                    'http://backend:8000/register',
                    json={'email': f'loadtest_{user_id}@example.com', 'password': 'password123'},
                    timeout=10
                )
                return response.status_code
            except Exception as e:
                return str(e)
        
        print('Starting basic load test...')
        with ThreadPoolExecutor(max_workers=5) as executor:
            results = list(executor.map(register_user, range(10)))
        
        print(f'Load test results: {results}')
        success_count = sum(1 for r in results if r == 200)
        print(f'Successful registrations: {success_count}/10')
        "

    - name: Upload performance results
      uses: actions/upload-artifact@v4
      with:
        name: performance-results
        path: |
          docker-compose logs backend
        retention-days: 30

  report:
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Allure report
      uses: actions/download-artifact@v4
      with:
        name: allure-report
        path: allure-report

    - name: Deploy Allure report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: allure-report
        keep_files: false
      if: github.ref == 'refs/heads/main'