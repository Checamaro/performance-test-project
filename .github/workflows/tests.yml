name: Run Tests and Generate Reports

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_COMPOSE_VERSION: v2.24.5

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Compose
      run: |
        sudo curl -L "https://github.com/docker/compose/releases/download/${{ env.DOCKER_COMPOSE_VERSION }}/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
        sudo chmod +x /usr/local/bin/docker-compose
        docker-compose --version

    - name: Build services
      run: |
        docker-compose -f docker-compose.ci.yml build backend tests

    - name: Start services with simple waiting
      run: |
        docker-compose -f docker-compose.ci.yml up -d
        echo "Waiting for services to start..."
        sleep 30
        
        echo "Checking services status..."
        docker-compose -f docker-compose.ci.yml ps
        
        echo "Backend logs:"
        docker-compose -f docker-compose.ci.yml logs backend --tail=20

    - name: Check backend availability
      run: |
        for i in {1..10}; do
          if curl -s http://localhost:8000/health > /dev/null; then
            echo "✓ Backend is responding!"
            break
          fi
          echo "Waiting for backend... ($i/10)"
          sleep 5
        done

    - name: Initialize database
      run: |
        docker-compose -f docker-compose.ci.yml exec backend python -c "
        try:
            from database.database import engine
            from models.user import Base
            Base.metadata.create_all(bind=engine)
            print('✓ Database tables created')
        except Exception as e:
            print(f'⚠ Database warning: {e}')
        " || echo "Database initialization completed"

    - name: Run API tests with Allure
      run: |
        # Запускаем тесты и генерируем Allure отчет в одной команде
        docker-compose -f docker-compose.ci.yml run --rm tests bash -c "
          echo 'Running API tests...'
          python -m pytest api/ -v --alluredir=/tmp/allure-results || echo 'Some tests failed'
          
          echo 'Checking if Allure results were created...'
          if [ -d '/tmp/allure-results' ] && [ \"$(ls -A /tmp/allure-results)\" ]; then
            echo 'Generating Allure report from test results...'
            allure generate /tmp/allure-results -o /tmp/allure-report --clean
            echo 'Allure report generated successfully'
          else
            echo 'No Allure results found, creating empty report...'
            mkdir -p /tmp/allure-report
            echo '<html><body><h1>No test results found</h1></body></html>' > /tmp/allure-report/index.html
          fi
        "

    - name: Copy Allure report from container
      run: |
        echo "Copying Allure report from tests container..."
        mkdir -p allure-report
        
        # Создаем временный контейнер для копирования отчета
        docker create --name temp-tests-container $(docker-compose -f docker-compose.ci.yml build -q tests)
        docker cp temp-tests-container:/tmp/allure-report/. allure-report/ || echo "Failed to copy from temp container"
        docker rm temp-tests-container
        
        # Альтернативно пробуем найти любой работающий tests контейнер
        if [ ! -d "allure-report" ] || [ -z "$(ls -A allure-report)" ]; then
          echo "Trying alternative copy method..."
          TESTS_CONTAINER=$(docker ps -a --filter "name=tests" --format "{{.ID}}" | head -1)
          if [ ! -z "$TESTS_CONTAINER" ]; then
            docker cp $TESTS_CONTAINER:/tmp/allure-report/. allure-report/ || echo "Alternative copy also failed"
          fi
        fi
        
        # Если все еще нет отчета, создаем заглушку
        if [ ! -d "allure-report" ] || [ -z "$(ls -A allure-report)" ]; then
          echo "Creating placeholder Allure report..."
          mkdir -p allure-report
          cat > allure-report/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <title>Test Report</title>
              <style>
                  body { font-family: Arial, sans-serif; margin: 40px; text-align: center; }
                  .info { color: #0c5460; background-color: #d1ecf1; padding: 20px; border-radius: 5px; }
              </style>
          </head>
          <body>
              <h1>API Test Report</h1>
              <div class="info">
                  <h2>Report Not Generated</h2>
                  <p>Test execution completed but Allure report could not be generated.</p>
                  <p>Check the test logs above for details.</p>
              </div>
          </body>
          </html>
          EOF
        fi
        
        echo "Final Allure report contents:"
        ls -la allure-report/

    - name: Upload Allure report
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30

    - name: Save and upload service logs
      if: always()
      run: |
        docker-compose -f docker-compose.ci.yml logs > docker-compose-logs.txt
        echo "=== Backend Logs ===" > detailed-logs.txt
        docker-compose -f docker-compose.ci.yml logs backend >> detailed-logs.txt
        echo "=== Tests Logs ===" >> detailed-logs.txt
        docker-compose -f docker-compose.ci.yml logs tests >> detailed-logs.txt 2>/dev/null || echo "No tests logs available"

    - name: Upload service logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: service-logs
        path: |
          docker-compose-logs.txt
          detailed-logs.txt
        retention-days: 30

  performance:
    runs-on: ubuntu-latest
    needs: api  # ← ИЗМЕНИЛИ С test НА api
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Compose
      run: |
        sudo curl -L "https://github.com/docker/compose/releases/download/${{ env.DOCKER_COMPOSE_VERSION }}/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
        sudo chmod +x /usr/local/bin/docker-compose

    - name: Start services for performance tests
      run: |
        docker-compose -f docker-compose.ci.yml up -d
        sleep 30
        docker-compose -f docker-compose.ci.yml ps

    - name: Run simple performance test
      run: |
        docker-compose -f docker-compose.ci.yml run --rm tests python -c "
        import requests
        import time
        import random
        
        def test_endpoint():
            try:
                response = requests.get('http://backend:8000/health', timeout=5)
                return response.status_code
            except:
                return 0
        
        print('Testing backend availability...')
        successes = 0
        start_time = time.time()
        
        for i in range(5):
            status = test_endpoint()
            if status == 200:
                successes += 1
                print(f'Request {i+1}: ✓ SUCCESS')
            else:
                print(f'Request {i+1}: ✗ FAILED (Status: {status})')
            time.sleep(1)
        
        duration = time.time() - start_time
        print(f'Results: {successes}/5 successful')
        
        if successes >= 3:
            print('✓ Performance test PASSED')
        else:
            print('✗ Performance test FAILED')
            exit(1)
        "

  report:
    runs-on: ubuntu-latest
    needs: [api, performance]  # ← ИЗМЕНИЛИ С test НА api
    if: always()

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Allure report artifact
      uses: actions/download-artifact@v4
      with:
        name: allure-report
        path: allure-report

    - name: Verify Allure report download
      run: |
        echo "Checking downloaded Allure report..."
        if [ -d "allure-report" ]; then
          echo "✓ Allure report downloaded successfully"
          ls -la allure-report/
        else
          echo "✗ Allure report not found, creating placeholder"
          mkdir -p allure-report
          cat > allure-report/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <title>Test Report - No Data</title>
              <style>
                  body { font-family: Arial, sans-serif; margin: 40px; text-align: center; }
                  .error { color: #d63384; background-color: #f8d7da; padding: 20px; border-radius: 5px; }
              </style>
          </head>
          <body>
              <h1>API Test Report</h1>
              <div class="error">
                  <h2>No Test Results Available</h2>
                  <p>Allure report was not generated during test execution.</p>
                  <p>Check the workflow logs for details.</p>
              </div>
          </body>
          </html>
          EOF
        fi

    - name: Setup Pages
      uses: actions/configure-pages@v4
      if: github.ref == 'refs/heads/main'

    - name: Upload to GitHub Pages
      uses: actions/upload-pages-artifact@v3
      if: github.ref == 'refs/heads/main'
      with:
        path: allure-report

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
      if: github.ref == 'refs/heads/main'