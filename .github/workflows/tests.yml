name: Run Tests and Generate Reports

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_COMPOSE_VERSION: v2.24.5

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Compose
      run: |
        sudo curl -L "https://github.com/docker/compose/releases/download/${{ env.DOCKER_COMPOSE_VERSION }}/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
        sudo chmod +x /usr/local/bin/docker-compose
        docker-compose --version

    - name: Build services
      run: |
        docker-compose -f docker-compose.ci.yml build backend tests

    - name: Start services
      run: |
        docker-compose -f docker-compose.ci.yml up -d
        sleep 30

    - name: Check backend health
      run: |
        for i in {1..10}; do
          if curl -s http://localhost:8000/health > /dev/null; then
            echo "Backend is ready!"
            break
          fi
          echo "Waiting for backend... ($i/10)"
          sleep 5
        done
        curl -f http://localhost:8000/health || exit 1

    - name: Check services status
      run: |
        docker-compose -f docker-compose.ci.yml ps
        docker-compose -f docker-compose.ci.yml logs backend

    - name: Run API tests
      run: |
        docker-compose -f docker-compose.ci.yml run --rm tests python -m pytest api/ -v --alluredir=/tmp/allure-results

    - name: Generate Allure report
      run: |
        mkdir -p allure-report
        docker-compose -f docker-compose.ci.yml run --rm tests allure generate /tmp/allure-results -o allure-report --clean

    - name: Upload Allure report
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30

    - name: Upload service logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: service-logs
        path: |
          docker-compose-logs.txt
        retention-days: 30
      env:
        DOCKER_COMPOSE_FILE: docker-compose.ci.yml

    - name: Save logs
      if: always()
      run: |
        docker-compose -f docker-compose.ci.yml logs > docker-compose-logs.txt

  performance:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Compose
      run: |
        sudo curl -L "https://github.com/docker/compose/releases/download/${{ env.DOCKER_COMPOSE_VERSION }}/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
        sudo chmod +x /usr/local/bin/docker-compose

    - name: Build and start services
      run: |
        docker-compose -f docker-compose.ci.yml up -d
        sleep 30

    - name: Run load test
      run: |
        # Используем locust для нагрузочного тестирования
        docker-compose -f docker-compose.ci.yml run --rm tests python -c "
        import requests
        import time
        from concurrent.futures import ThreadPoolExecutor
        import random
        
        def test_registration(user_id):
            try:
                email = f'loadtest_{user_id}_{random.randint(1000,9999)}@example.com'
                response = requests.post(
                    'http://backend:8000/register',
                    json={'email': email, 'password': 'testpassword123'},
                    timeout=10
                )
                return response.status_code
            except Exception as e:
                return f'Error: {e}'
        
        print('Starting load test with 20 virtual users...')
        start_time = time.time()
        
        with ThreadPoolExecutor(max_workers=20) as executor:
            results = list(executor.map(test_registration, range(20)))
        
        end_time = time.time()
        duration = end_time - start_time
        
        success_count = sum(1 for r in results if r == 200)
        error_count = sum(1 for r in results if isinstance(r, str) or r >= 400)
        
        print(f'Load test completed in {duration:.2f} seconds')
        print(f'Successful: {success_count}/20')
        print(f'Errors: {error_count}/20')
        print(f'RPS: {20/duration:.2f}')
        
        if success_count >= 15:
            print('Load test PASSED')
        else:
            print('Load test FAILED')
            exit(1)
        "

  report:
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Allure report
      uses: actions/download-artifact@v4
      with:
        name: allure-report
        path: allure-report

    - name: Setup Pages
      uses: actions/configure-pages@v4
      if: github.ref == 'refs/heads/main'

    - name: Upload to GitHub Pages
      uses: actions/upload-pages-artifact@v3
      if: github.ref == 'refs/heads/main'
      with:
        path: allure-report

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
      if: github.ref == 'refs/heads/main'