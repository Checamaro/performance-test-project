name: Run Tests and Generate Reports

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      - name: Build services
        run: |
          docker-compose -f docker-compose.ci.yml build backend tests

      - name: Start services with simple waiting
        run: |
          docker-compose -f docker-compose.ci.yml up -d
          echo "Waiting for services to start..."
          sleep 30
          echo "Checking services status..."
          docker-compose -f docker-compose.ci.yml ps
          echo "Backend logs:"
          docker-compose -f docker-compose.ci.yml logs backend --tail=20

      - name: Check backend availability
        run: |
          for i in {1..10}; do
            if curl -s http://localhost:8000/health > /dev/null; then
              echo "Backend is responding!"
              break
            fi
            echo "Waiting for backend... ($i/10)"
            sleep 5
          done

      - name: Initialize database
        run: |
          docker-compose -f docker-compose.ci.yml exec backend python -c "
          try:
              from database.database import engine
              from models.user import Base
              Base.metadata.create_all(bind=engine)
              print('Database tables created')
          except Exception as e:
              print(f'Database warning: {e}')
          " || echo "Database initialization completed"

      - name: Run API tests and generate Allure report
        run: |
          # Запускаем тесты и генерируем отчет в одном контейнере
          mkdir -p allure-report
          docker-compose -f docker-compose.ci.yml run --rm -v $(pwd)/allure-report:/host-report tests bash -c "
            echo 'Running API tests with Allure...'
            python -m pytest api/ -v --alluredir=/tmp/allure-results
            
            echo 'Checking if Allure results were created...'
            if [ -d '/tmp/allure-results' ] && [ \"\$(ls -A /tmp/allure-results)\" ]; then
              echo 'Generating Allure report...'
              allure generate /tmp/allure-results -o /tmp/allure-report --clean
              echo 'Copying Allure report to host...'
              cp -r /tmp/allure-report/* /host-report/
              echo 'Allure report generated and copied successfully'
            else
              echo 'No Allure results found, creating basic report...'
              mkdir -p /host-report
              echo '<html><body><h1>Test Report</h1><p>No test results available</p></body></html>' > /host-report/index.html
            fi
          "
          
          echo "Allure report contents on host:"
          ls -la allure-report/

      - name: Upload Allure report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.event.pull_request.number || github.sha }}
          path: allure-report/
          retention-days: 7

      - name: Save and upload service logs
        if: always()
        run: |
          docker-compose -f docker-compose.ci.yml logs > docker-compose-logs.txt
          echo "Backend Logs" > detailed-logs.txt
          docker-compose -f docker-compose.ci.yml logs backend >> detailed-logs.txt

      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs-${{ github.event.pull_request.number || github.sha }}
          path: |
            docker-compose-logs.txt
            detailed-logs.txt
          retention-days: 7

  performance:
    runs-on: ubuntu-latest
    needs: api
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

      - name: Start services for performance tests
        run: |
          docker-compose -f docker-compose.ci.yml up -d
          sleep 30
          docker-compose -f docker-compose.ci.yml ps

      - name: Run simple performance test
        run: |
          # Простейший тест - один запрос к health endpoint
          docker-compose -f docker-compose.ci.yml run --rm tests python -c "import requests; r = requests.get('http://backend:8000/health', timeout=10); print(f'Health check: {r.status_code}'); exit(0 if r.status_code == 200 else 1)"

  # Деплой отчета на GitHub Pages только для main ветки
  deploy-main-report:
    runs-on: ubuntu-latest
    needs: [api, performance]
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
      contents: read

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Allure report artifact
        uses: actions/download-artifact@v4
        with:
          name: allure-report-${{ github.sha }}
          path: ./_site

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Комментарий с отчетом для pull request'ов
  pr-report-comment:
    runs-on: ubuntu-latest
    needs: [api, performance]
    if: github.event_name == 'pull_request' && always()
    permissions:
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Allure report
        uses: actions/download-artifact@v4
        with:
          name: allure-report-${{ github.event.pull_request.number }}
          path: ./pr-allure-report

      - name: Create summary report for PR
        run: |
          echo "Creating PR test summary..."
          
          # Проверяем есть ли отчет
          if [ -f "pr-allure-report/widgets/summary.json" ]; then
            echo "Found Allure summary data"
            
            # Парсим JSON с результатами
            STATS=$(cat pr-allure-report/widgets/summary.json)
            
            TOTAL=$(echo "$STATS" | grep -o '"total":[0-9]*' | cut -d: -f2)
            PASSED=$(echo "$STATS" | grep -o '"passed":[0-9]*' | cut -d: -f2)
            FAILED=$(echo "$STATS" | grep -o '"failed":[0-9]*' | cut -d: -f2)
            BROKEN=$(echo "$STATS" | grep -o '"broken":[0-9]*' | cut -d: -f2)
            SKIPPED=$(echo "$STATS" | grep -o '"skipped":[0-9]*' | cut -d: -f2)
            
            # Создаем красивый комментарий
            cat > pr-comment.md << EOF
            ## 📊 Test Results Summary

            ### API Tests
            - ✅ **Passed:** ${PASSED:-0}
            - ❌ **Failed:** ${FAILED:-0}
            - ⚠️ **Broken:** ${BROKEN:-0}
            - ⏭️ **Skipped:** ${SKIPPED:-0}
            - 📈 **Total:** ${TOTAL:-0}

            ### Performance Tests
            - ✅ **Status:** ${{ needs.performance.result == 'success' && 'PASSED' : 'FAILED' }}

            ### 📎 Artifacts
            - [Download Full Allure Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - [View Test Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ${{ needs.api.result == 'success' && needs.performance.result == 'success' && '🎉 **All tests passed! Ready for review.**' : '❌ **Some tests failed. Please check the report.**' }}
            EOF
          else
            # Если отчета нет
            cat > pr-comment.md << EOF
            ## 📊 Test Results Summary

            ### Status
            - API Tests: ${{ needs.api.result }}
            - Performance Tests: ${{ needs.performance.result }}

            ### 📎 Artifacts  
            - [View Workflow Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ℹ️ *Full test report is not available. Check workflow logs for details.*
            EOF
          fi

      - name: Add or update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const commentBody = fs.readFileSync('./pr-comment.md', 'utf8');
            
            // Ищем существующий комментарий от этого workflow
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Test Results Summary')
            );
            
            if (botComment) {
              // Обновляем существующий комментарий
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              // Создаем новый комментарий
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: commentBody
              });
            }