image: docker:24

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2

services:
  - docker:24-dind

stages:
  - test
  - reports

before_script:
  - apk add --no-cache docker-compose curl python3 py3-pip git
  - docker --version
  - docker-compose --version

# Основные тесты при мердж реквеста
api_tests:
  stage: test
  script:
    - echo "Starting test environment..."
    - docker-compose up -d backend postgres kafka
    - sleep 30
    - echo "Running API tests..."
    - docker-compose run --rm tests python -m pytest tests/api/ -v --alluredir=/tmp/allure-results
    - echo "Test execution completed"
  artifacts:
    paths:
      - /tmp/allure-results/
    when: always
    expire_in: 1 week
  after_script:
    - docker-compose down

# Ручной запуск полного тестирования с отчетами
allure_reports:
  stage: reports
  script:
    - echo "🚀 Starting full test suite with Allure reports..."
    - docker-compose up -d backend postgres kafka
    - sleep 30
    - echo "📊 Running comprehensive tests..."
    - docker-compose run --rm tests python -m pytest tests/api/ -v --alluredir=/tmp/allure-results
    - echo "📈 Generating Allure report..."
    - docker-compose run --rm tests allure generate /tmp/allure-results -o public/allure-report --clean
    - echo "✅ Allure report generated!"
  artifacts:
    paths:
      - public/allure-report/
    when: always
    expire_in: 1 month
  dependencies:
    - api_tests
  only:
    - main
    - master
  when: manual
  allow_failure: false

# Нагрузочное тестирование (ручной запуск)
performance_tests:
  stage: reports
  script:
    - echo "🔥 Starting performance tests..."
    - docker-compose up -d backend postgres kafka locust
    - sleep 30
    - echo "📊 Running load tests..."
    - docker-compose run --rm locust locust -f /mnt/locust/locustfile.py --host=http://backend:8000 --headless --users 5 --spawn-rate 1 --run-time 2m --html=public/locust-report.html
    - echo "✅ Performance tests completed!"
  artifacts:
    paths:
      - public/locust-report.html
    when: always
    expire_in: 1 month
  only:
    - main
    - master
  when: manual
  allow_failure: false

# Публикация отчетов в Pages
pages:
  stage: reports
  script:
    - echo "🌐 Publishing test reports to GitLab Pages..."
    - mkdir public
    - |
      if [ -d "public/allure-report" ]; then
        echo "📊 Allure report found, publishing..."
      else
        echo "⚠️ No Allure report found, generating sample..."
        mkdir -p public/allure-report
        cat > public/allure-report/index.html << 'HTML_EOF'
<!DOCTYPE html>
<html>
<head>
    <title>Allure Report</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .card { border: 1px solid #ddd; padding: 20px; margin: 10px 0; border-radius: 5px; }
        .btn { display: inline-block; padding: 10px 20px; background: #007bff; color: white; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Allure Test Reports</h1>
    <div class="card">
        <p>Run the 'allure_reports' job to generate full test reports</p>
        <a href="../jobs" class="btn">View CI/CD Jobs</a>
    </div>
</body>
</html>
HTML_EOF
      fi
  artifacts:
    paths:
      - public
    expire_in: 30 days
  only:
    - main
    - master